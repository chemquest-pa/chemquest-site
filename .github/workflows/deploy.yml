# Publishes the website whenever someone saves a change to the main branch on GitHub.
# It builds the site and uploads it to the Cloudflare Pages project "chemquest" (chemquest.pages.dev).
#
# One-time setup, in the GitHub repository: Settings > Secrets and variables > Actions > New repository secret
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token with the permission "Account > Cloudflare Pages > Edit"
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account ID (shown on the Cloudflare dashboard's Workers & Pages page)
# See EDITING.md, "Working together on GitHub".
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you publish by hand from the Actions tab

# Only one publish at a time; a newer one replaces one that's waiting.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=chemquest --branch=main
