# Copies new newsletter issues from beehiiv into the website, saves them to GitHub, and publishes.
# Issues go out at 11 AM Eastern on Sundays (every other week). This checks every 15 minutes from about
# 11:07 AM to 12:52 PM Eastern on Sundays, plus once on Monday morning in case an issue went out late.
# A check that finds nothing new just stops, so the off weeks cost nothing. You can also run it by hand
# from the Actions tab ("Import newsletter" > "Run workflow").
#
# It publishes in the same run because GitHub doesn't start the "Publish website" job for changes
# that a job saves itself. It uses the same two Cloudflare secrets as deploy.yml.
#
# After it runs, check the new issue's file in src/content/newsletter/ for its title and topic (EDITING.md).
name: Import newsletter

on:
  schedule:
    # GitHub's clock is UTC, and Eastern time shifts by an hour for daylight saving, so both hours are covered.
    # Minutes are off the hour on purpose: GitHub is busiest (and slowest to start jobs) right on the hour.
    - cron: '7,22,37,52 15 * * 0'  # Sundays 11:07 AM to 11:52 AM Eastern in summer (10:07 to 10:52 AM in winter)
    - cron: '7,22,37,52 16 * * 0'  # Sundays 11:07 AM to 11:52 AM Eastern in winter (12:07 to 12:52 PM in summer)
    - cron: '17 14 * * 1'          # Monday morning backup (about 9 or 10 AM Eastern)
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write # to save the imported issues

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run newsletter
      - name: Save new issues
        id: save
        run: |
          git add src/content/newsletter src/assets/newsletter
          if git diff --cached --quiet; then
            echo "No new issues."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Import new newsletter issues from beehiiv"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.save.outputs.changed == 'true'
        run: npm run build
      - if: steps.save.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=chemquest --branch=main
